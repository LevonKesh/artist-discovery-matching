[project]
name = "artsytask"
version = "0.1.0"
description = "Artist discovery and cross-platform profile matching prototype"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
    "tavily-python>=0.8.1",
]

[project.scripts]
artsytask = "artsytask:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
